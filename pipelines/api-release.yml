# CD: takes the artifact published by foodfast-api-build and deploys it to the Web App
# provisioned by infra-deploy.yml. Single environment - no staging/production split.
#
# Create this as an Azure DevOps pipeline named "foodfast-api-release". It has no path/branch
# trigger of its own - it fires automatically whenever the build pipeline completes (matched by
# the exact name given at pipeline-creation time, referenced below as
# "Olalekog.food-delivery-startup" - update `source:` if the build pipeline is named
# differently).
#
# keyVaultName and webAppName come from the "foodfast-api" Library variable group instead of
# being hardcoded - see DEPLOY.md. azureSubscription below stays a hardcoded literal, though -
# confirmed on a real pipeline run that Azure DevOps' service-connection authorization check
# matches the task input's literal string and does not expand $(var)/variable-group values first,
# so a variable-sourced value fails with "service connection ... could not be found" (this is not
# specific to AzureWebApp@1/AzureKeyVault@2 - the same thing happens with AzureCLI@2 in
# infra-deploy.yml; the Pipeline Preview API doesn't catch it because it doesn't run this check).
#
# Pulls the Cosmos primary key and the storage connection string straight from that Key Vault via
# AzureKeyVault@2 - no variable group needed as an intermediary for either, same
# direct-from-Key-Vault pattern as cosmosdb-data-fetch/azure-pipelines.yml. This is what "Cosmos
# key lives in Key Vault and is injected by the pipeline" means in practice: the key never lives
# in a repo file, a Library variable group, or the Terraform-managed Web App config - only in the
# vault and, transiently, in this deploy step's app settings push. The storage connection string
# follows the same pattern (rather than managed identity/RBAC) for the same permission-constraint
# reason documented in infra/terraform/web_app.tf.
#
# Runs on the self-hosted agent "OGOGUNDARE", registered in the "self-hosted" agent pool.
# The target Web App is Linux App Service; SCM_DO_BUILD_DURING_DEPLOYMENT=true makes Kudu's Oryx
# build run `npm install` server-side after deploy, since the artifact ships source only.

trigger: none

resources:
  pipelines:
  - pipeline: apiBuild
    source: Olalekog.food-delivery-startup
    trigger: true

pool:
  name: self-hosted
  demands:
  - Agent.Name -equals OGOGUNDARE

stages:
- stage: Deploy
  displayName: 'Deploy to Azure App Service'
  jobs:
  - deployment: Deploy
    displayName: 'Deploy to Web App'
    # environment: must stay a literal - confirmed via the Pipeline Preview API that neither
    # $(var) macro syntax nor ${{ parameters.x }} template expressions are accepted here. It's
    # resolved structurally (bound to the Environment/Checks system) before variables are
    # available - same underlying category of issue as azureSubscription below, just caught by a
    # different validation pass (Preview catches this one; only a real run catches that one).
    environment: foodfast-api
    variables:
    - group: foodfast-api
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: none

          - task: AzureKeyVault@2
            displayName: 'Fetch Cosmos key and storage connection string from Key Vault'
            inputs:
              azureSubscription: 'AzureTraining (606e824b-aaf7-4b4e-9057-b459f6a4436d)'
              KeyVaultName: '$(keyVaultName)'
              SecretsFilter: 'cosmosPrimaryKey,cosmosEndpoint,storageConnectionString'
              RunAsPreJob: false

          - download: apiBuild
            artifact: foodfast-api-release

          - task: AzureWebApp@1
            displayName: 'Deploy to Web App'
            inputs:
              azureSubscription: 'AzureTraining (606e824b-aaf7-4b4e-9057-b459f6a4436d)'
              appType: webAppLinux
              appName: '$(webAppName)'
              package: '$(Pipeline.Workspace)/apiBuild/foodfast-api-release/latest.zip'
              appSettings: '-COSMOS_KEY $(cosmosPrimaryKey) -COSMOS_ENDPOINT $(cosmosEndpoint) -STORAGE_CONNECTION_STRING $(storageConnectionString) -SCM_DO_BUILD_DURING_DEPLOYMENT true'
