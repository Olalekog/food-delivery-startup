# CI/CD for the Terraform infrastructure itself - separate from the app build/release pipelines,
# since a Terraform apply can create/destroy real, billable resources and deserves its own review
# point rather than being folded into an app deploy.
#
# Single environment (no staging/production split - see README.md). Plan runs automatically on
# every push to infra/terraform on main; Apply is gated behind a ManualValidation backstop and
# applies the exact plan file Plan published, never a fresh plan, so what gets approved is what
# gets applied.
#
# Create this as an Azure DevOps pipeline named "foodfast-infra-deploy" in project training-proj,
# pointed at this repo's main branch. Runs on the hosted ubuntu-latest pool (not the self-hosted
# agent used by the app pipelines below).
#
# Both backend.hcl and terraform.tfvars are generated at runtime from the "foodfast" Library
# variable group (Pipelines > Library) - see DEPLOY.md for how to create it. Required variables:
#   resourceGroupName       - "Training-Batch-6.23"
#   storageAccountName      - "olalekog"
#   tfstateContainerName    - "tfstate"
#   tfstateKey              - "foodfast.tfstate"
#   opsNotificationEmail    - secret; the "New order received" recipient
#
# azureSubscription below stays a hardcoded literal, not sourced from a variable - confirmed on a
# real pipeline run that Azure DevOps' service-connection authorization check matches against the
# literal string in the task input and does NOT expand $(var)/variable-group values first, so a
# variable-sourced value fails with "service connection ... could not be found" regardless of task
# type (this affects AzureCLI@2 here exactly the same as AzureWebApp@1/AzureFunctionApp@2 in the
# app release pipelines - it is not task-specific, and the Pipeline Preview API does not catch
# this because it doesn't run that specific check).
#
# addSpnToEnvironment: true + the ARM_* exports below are required because AzureCLI@2 logs in via
# `az login --service-principal`, and the azurerm provider's default Azure CLI auth mode
# explicitly refuses service-principal CLI sessions ("only supported as a User") - confirmed on a
# real run. addSpnToEnvironment exposes the connection's credentials as servicePrincipalId/
# servicePrincipalKey/tenantId (not ARM_*-named), so they're re-exported under the names the
# azurerm provider actually looks for, which makes it use Service Principal auth instead of
# attempting (and failing) CLI auth.

trigger:
  branches:
    include:
    - main
  paths:
    include:
    - infra/terraform

variables:
  terraformVersion: '1.15.8'

stages:
- stage: Plan
  displayName: 'Plan'
  jobs:
  - job: Plan
    pool:
      vmImage: ubuntu-latest
    variables:
    - group: foodfast
    steps:
    - script: |
        set -euo pipefail
        curl -fsSL "https://releases.hashicorp.com/terraform/$(terraformVersion)/terraform_$(terraformVersion)_linux_amd64.zip" -o /tmp/terraform.zip
        sudo unzip -o /tmp/terraform.zip -d /usr/local/bin
        terraform -version
      displayName: 'Install Terraform'

    - script: |
        set -euo pipefail
        cat > infra/terraform/backend.hcl <<EOF
        resource_group_name  = "$(resourceGroupName)"
        storage_account_name = "$(storageAccountName)"
        container_name        = "$(tfstateContainerName)"
        key                    = "$(tfstateKey)"
        EOF
        cat > infra/terraform/terraform.tfvars <<EOF
        ops_notification_email = "$(opsNotificationEmail)"
        EOF
      displayName: 'Generate backend config and tfvars from Library variables'

    - task: AzureCLI@2
      displayName: 'terraform init && terraform plan'
      inputs:
        azureSubscription: 'AzureTraining (606e824b-aaf7-4b4e-9057-b459f6a4436d)'
        scriptType: bash
        workingDirectory: infra/terraform
        scriptLocation: inlineScript
        addSpnToEnvironment: true
        inlineScript: |
          set -euo pipefail
          export ARM_CLIENT_ID="$servicePrincipalId"
          export ARM_CLIENT_SECRET="$servicePrincipalKey"
          export ARM_TENANT_ID="$tenantId"
          export ARM_SUBSCRIPTION_ID="$(az account show --query id -o tsv)"
          # Idempotent - confirmed via a real run that the tfstate container did not already
          # exist in $(storageAccountName) as assumed; create-if-missing here instead of treating
          # it as a one-time manual prerequisite.
          az storage container create --name "$(tfstateContainerName)" --account-name "$(storageAccountName)" --auth-mode login
          terraform init -backend-config=backend.hcl -reconfigure -input=false
          terraform plan -input=false -out=tfplan

          # TEMPORARY DEBUG round 7 - confirmed definitively: /admin/functions returns [], the
          # wwwroot zip is only 257 bytes (code never landed), and Application/Functions/ is
          # empty. StartupLogs/..._success.log (65KB, written right after deployment) is the
          # remaining lead - almost certainly Oryx/Kudu's actual build log, which should explain
          # why the content never made it into wwwroot.
          set +e
          echo "=== DEBUG round 7 ==="
          KUDU_CREDS=$(az functionapp deployment list-publishing-credentials --name foodfast-orders-fn-ogogundare --resource-group "$(resourceGroupName)" --query "{u:publishingUserName, p:publishingPassword}" -o json)
          KUDU_USER=$(echo "$KUDU_CREDS" | python3 -c "import json,sys; print(json.load(sys.stdin)['u'])" 2>/dev/null)
          KUDU_PASS=$(echo "$KUDU_CREDS" | python3 -c "import json,sys; print(json.load(sys.stdin)['p'])" 2>/dev/null)
          curl -s -u "$KUDU_USER:$KUDU_PASS" "https://foodfast-orders-fn-ogogundare.scm.azurewebsites.net/api/vfs/LogFiles/StartupLogs/2026_08_18_pl0sdlwk000L2J_success.log" > /tmp/success.log
          echo "success.log size: $(wc -c < /tmp/success.log)"
          echo "--- lines matching error/exception/fail/npm/oryx/zip/extract/warn (case-insensitive) ---"
          grep -iE "error|exception|fail|npm|oryx|zip|extract|warn|node_modules|package.json" /tmp/success.log | head -100
          echo "=== END DEBUG round 7 ==="
          set -e

    - publish: infra/terraform/tfplan
      artifact: foodfast-tfplan
      displayName: 'Publish plan file'

- stage: Apply
  displayName: 'Apply'
  dependsOn: Plan
  jobs:
  - job: WaitForApproval
    displayName: 'Manual approval to apply infrastructure'
    pool: server
    timeoutInMinutes: 1440
    steps:
    - task: ManualValidation@0
      timeoutInMinutes: 1440
      inputs:
        instructions: 'Review the Plan stage logs, then approve to apply Terraform to Training-Batch-6.23.'

  - deployment: Apply
    displayName: 'Apply'
    dependsOn: WaitForApproval
    environment: foodfast
    pool:
      vmImage: ubuntu-latest
    variables:
    - group: foodfast
    strategy:
      runOnce:
        deploy:
          steps:
          # deployment jobs don't auto-checkout the repo like regular jobs do - confirmed on a
          # real run that omitting this leaves infra/terraform/ missing entirely, failing the
          # "Generate backend config" step with "No such file or directory".
          - checkout: self

          - download: current
            artifact: foodfast-tfplan
            displayName: 'Download plan file'

          - script: |
              set -euo pipefail
              curl -fsSL "https://releases.hashicorp.com/terraform/$(terraformVersion)/terraform_$(terraformVersion)_linux_amd64.zip" -o /tmp/terraform.zip
              sudo unzip -o /tmp/terraform.zip -d /usr/local/bin
              terraform -version
            displayName: 'Install Terraform'

          - script: |
              set -euo pipefail
              cat > infra/terraform/backend.hcl <<EOF
              resource_group_name  = "$(resourceGroupName)"
              storage_account_name = "$(storageAccountName)"
              container_name        = "$(tfstateContainerName)"
              key                    = "$(tfstateKey)"
              EOF
              cp "$(Pipeline.Workspace)/foodfast-tfplan/tfplan" infra/terraform/tfplan
            displayName: 'Generate backend config and stage plan file'

          - task: AzureCLI@2
            displayName: 'terraform init && terraform apply'
            inputs:
              azureSubscription: 'AzureTraining (606e824b-aaf7-4b4e-9057-b459f6a4436d)'
              scriptType: bash
              workingDirectory: infra/terraform
              scriptLocation: inlineScript
              addSpnToEnvironment: true
              inlineScript: |
                set -euo pipefail
                export ARM_CLIENT_ID="$servicePrincipalId"
                export ARM_CLIENT_SECRET="$servicePrincipalKey"
                export ARM_TENANT_ID="$tenantId"
                export ARM_SUBSCRIPTION_ID="$(az account show --query id -o tsv)"
                terraform init -backend-config=backend.hcl -reconfigure -input=false
                terraform apply -input=false tfplan
