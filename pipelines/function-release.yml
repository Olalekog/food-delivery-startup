# CD: deploys the artifact published by foodfast-function-build to the Function App provisioned
# by infra-deploy.yml. Single environment - no staging/production split.
#
# Create this as an Azure DevOps pipeline named "foodfast-function-release", fired automatically
# by the build pipeline's completion (update `source:` below if it's named differently at
# creation time). Uses AzureFunctionApp@2 (not AzureWebApp@1) with appType functionAppLinux.
#
# functionAppName comes from the "foodfast-function" Library variable group instead of being
# hardcoded - see DEPLOY.md. azureSubscription stays a hardcoded literal - see the equivalent note
# in api-release.yml (confirmed on a real run; Azure DevOps' service-connection authorization
# check doesn't expand variable-group values before matching).
#
# Runs on the self-hosted agent "OGOGUNDARE", registered in the "self-hosted" agent pool.

trigger: none

resources:
  pipelines:
  - pipeline: functionBuild
    source: Olalekog.food-delivery-startup-function
    trigger: true

pool:
  name: self-hosted
  demands:
  - Agent.Name -equals OGOGUNDARE

stages:
- stage: Deploy
  displayName: 'Deploy to Function App'
  jobs:
  - deployment: Deploy
    displayName: 'Deploy to Function App'
    # environment: must stay a literal - see the equivalent note in api-release.yml, confirmed
    # via the Pipeline Preview API.
    environment: foodfast-function
    variables:
    - group: foodfast-function
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: none

          - download: functionBuild
            artifact: foodfast-function-release

          - task: AzureFunctionApp@2
            displayName: 'Deploy to Function App'
            inputs:
              azureSubscription: 'AzureTraining (606e824b-aaf7-4b4e-9057-b459f6a4436d)'
              appType: functionAppLinux
              appName: '$(functionAppName)'
              package: '$(Pipeline.Workspace)/functionBuild/foodfast-function-release/latest.zip'
